name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # v6 的输入名是 run_install（默认 null，本来不自动安装）。
          # 显式关掉，避免将来升级到把默认值改成 true 的版本；安装一律走下面的显式步骤。
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      # v2 重命名了全部输入：version/publish/commit/title →
      # version-script/publish-script/commit-message/pr-title
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          # Trusted Publishers for seam-hooks and seam-react point at this file.
          publish-script: pnpm publish:npm
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
