name: AI Review Revision

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ai-revise-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  revise:
    if: >-
      github.event.label.name == 'ai-revise' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'codex/')
    runs-on: ubuntu-latest
    steps:
      - name: Initialize Revision
        id: init
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const previousRounds = pr.labels.filter((label) =>
              /^ai-revision-\d+$/.test(label.name)
            ).length;
            const revisionRound = previousRounds + 1;
            const issue_number = pr.number;

            for (const name of [
              'ai-revise',
              'ai-review-approved',
              'ai-awaiting-review',
              'ai-review-needs-human',
            ]) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: [`ai-revision-${revisionRound}`],
            });

            core.setOutput('branch', pr.head.ref);
            core.setOutput('sha', pr.head.sha);
            core.setOutput('round', String(revisionRound));
            core.setOutput(
              'component',
              pr.title.replace(/^(?:feat|fix|enhance|refactor|chore|docs)(?:\([^)]+\))?\s*[:：]\s*/i, ''),
            );

      - name: Check Out Pull Request
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.init.outputs.sha }}
          fetch-depth: 0

      - name: Prepare Revision Branch
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin main "${{ steps.init.outputs.branch }}"
          git checkout -B "${{ steps.init.outputs.branch }}" "${{ steps.init.outputs.sha }}"
          RUN_ID=$(git diff --name-only origin/main...HEAD -- .agent/runs | awk -F/ 'NF >= 3 { print $3 }' | head -n 1)
          if [ -z "$RUN_ID" ]; then
            echo "Unable to locate the Agent run directory for this pull request."
            exit 1
          fi
          echo "AGENT_BRANCH=${{ steps.init.outputs.branch }}" >> "$GITHUB_ENV"
          echo "AGENT_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Collect Review Feedback
        env:
          FEEDBACK_FILE: ${{ runner.temp }}/review-feedback.md
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue_number = context.payload.pull_request.number;
            const options = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            };
            const [conversation, reviews, inlineComments] = await Promise.all([
              github.paginate(github.rest.issues.listComments, {
                ...options,
                issue_number,
              }),
              github.paginate(github.rest.pulls.listReviews, {
                ...options,
                pull_number: issue_number,
              }),
              github.paginate(github.rest.pulls.listComments, {
                ...options,
                pull_number: issue_number,
              }),
            ]);
            const sections = [];
            const reviewerFeedback = conversation
              .filter((comment) =>
                comment.body?.includes('<!-- ai-reviewer:request_changes -->')
              )
              .at(-1);
            if (reviewerFeedback) {
              sections.push(`## Independent Reviewer\n${reviewerFeedback.body}`);
            }

            const humanConversation = conversation.filter((comment) =>
              comment.body &&
              !comment.body.includes('<!-- ai-reviewer:') &&
              comment.user?.type !== 'Bot'
            );
            for (const comment of humanConversation.slice(-10)) {
              sections.push(`## Human PR Comment\n${comment.body}`);
            }
            for (const review of reviews.filter((review) =>
              review.body && review.user?.type !== 'Bot'
            )) {
              sections.push(`## Human ${review.state} Review\n${review.body}`);
            }
            for (const comment of inlineComments.filter((comment) =>
              comment.user?.type !== 'Bot'
            )) {
              sections.push(
                `## Inline Review: ${comment.path}:${comment.line || comment.original_line || ''}\n${comment.body}`,
              );
            }

            if (sections.length === 0) {
              core.setFailed('No Reviewer or human review feedback was found.');
              return;
            }
            fs.writeFileSync(process.env.FEEDBACK_FILE, sections.join('\n\n'));

      - name: Run Builder Revision
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL: ${{ secrets.ARK_MODEL || 'ark-code-latest' }}
          AGENT_COMPONENT: ${{ steps.init.outputs.component }}
          AGENT_RUN_ID: ${{ env.AGENT_RUN_ID }}
          AGENT_TYPE: bugfix
          AGENT_BASE_REF: origin/main
          AGENT_REVIEW_LOG: ${{ runner.temp }}/review-feedback.md
        run: node .agent/agent.mjs

      - name: Verify Revision
        run: |
          set -o pipefail
          CI=true pnpm format
          CI=true pnpm lint:fix || true
          { CI=true pnpm check && CI=true pnpm test:e2e; } 2>&1 | tee "$RUNNER_TEMP/revision-verification.log"

      - name: Commit Verified Revision
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "The Builder did not produce any changes."
            exit 1
          fi
          git add -A
          git commit --no-verify -m "fix(ui): address AI review feedback"
          git push origin "HEAD:${AGENT_BRANCH}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Upload Revision Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-revision-${{ github.event.pull_request.number }}-${{ steps.init.outputs.round }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/review-feedback.md
            ${{ runner.temp }}/revision-verification.log
            .agent/runs/${{ env.AGENT_RUN_ID }}/repair-raw.md

      - name: Comment On Success
        if: success() && steps.commit.outputs.pushed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `🔧 Builder addressed the review feedback and passed all checks. The independent Reviewer will review the new commit after CI succeeds.`,
            });

      - name: Require Human On Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.pull_request.number;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: ['ai-review-needs-human'],
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `⚠️ The review revision did not pass all checks, so no unverified revision was pushed. Human review is required. See the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for logs.`,
            });
