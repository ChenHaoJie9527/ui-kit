name: AI Reviewer

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'codex/')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Eligible Pull Request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const pr = pulls.find((candidate) =>
              candidate.head.sha === run.head_sha &&
              candidate.head.ref === run.head_branch &&
              candidate.head.repo?.full_name === context.repo.repo
            );

            if (!pr) {
              core.info('No open same-repository pull request matches this run.');
              return;
            }

            const revisionRound = pr.labels.filter((label) =>
              /^ai-revision-\d+$/.test(label.name)
            ).length;
            core.setOutput('number', String(pr.number));
            core.setOutput('branch', pr.head.ref);
            core.setOutput('sha', pr.head.sha);
            core.setOutput('title', pr.title);
            core.setOutput('body', pr.body || '');
            core.setOutput('round', String(revisionRound));

      - name: Check Out Pull Request
        if: steps.pr.outputs.number != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0

      - name: Resolve Agent Run
        if: steps.pr.outputs.number != ''
        run: |
          git fetch origin main "${{ steps.pr.outputs.branch }}"
          git checkout -B "${{ steps.pr.outputs.branch }}" "${{ steps.pr.outputs.sha }}"
          RUN_ID=$(git diff --name-only origin/main...HEAD -- .agent/runs | awk -F/ 'NF >= 3 { print $3 }' | head -n 1)
          if [ -z "$RUN_ID" ]; then
            echo "Unable to locate the Agent run directory for this pull request."
            exit 1
          fi
          echo "AGENT_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        if: steps.pr.outputs.number != ''
        with:
          node-version: 22

      - name: Reset Previous Review State
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number('${{ steps.pr.outputs.number }}');
            for (const name of [
              'ai-review-approved',
              'ai-awaiting-review',
              'ai-review-needs-human',
            ]) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

      - name: Run Independent Reviewer
        if: steps.pr.outputs.number != ''
        id: review
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL: ${{ secrets.ARK_MODEL || 'ark-code-latest' }}
          AGENT_RUN_ID: ${{ env.AGENT_RUN_ID }}
          AGENT_BASE_REF: origin/main
          AGENT_REVIEW_ROUND: ${{ steps.pr.outputs.round }}
          AGENT_PR_TITLE: ${{ steps.pr.outputs.title }}
          AGENT_PR_BODY: ${{ steps.pr.outputs.body }}
        run: node .agent/reviewer.mjs

      - name: Publish Review Summary
        if: success() && steps.pr.outputs.number != ''
        env:
          REVIEW_FILE: ${{ steps.review.outputs.review-file }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.pr.outputs.number }}'),
              body: fs.readFileSync(process.env.REVIEW_FILE, 'utf8'),
            });

      - name: Apply Review Outcome
        if: success() && steps.pr.outputs.number != ''
        env:
          REVIEW_ACTION: ${{ steps.review.outputs.action }}
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number('${{ steps.pr.outputs.number }}');
            const removableLabels = [
              'ai-revise',
              'ai-review-approved',
              'ai-awaiting-review',
              'ai-review-needs-human',
            ];
            for (const name of removableLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const labels = process.env.REVIEW_ACTION === 'revise'
              ? ['ai-revise']
              : process.env.REVIEW_ACTION === 'awaiting-human-review'
                ? ['ai-awaiting-review', 'ai-review-approved']
                : ['ai-review-needs-human'];
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels,
            });

      - name: Upload Review Report
        if: always() && steps.pr.outputs.number != ''
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-${{ github.event.workflow_run.id }}
          if-no-files-found: ignore
          path: |
            .agent/runs/${{ env.AGENT_RUN_ID }}/review.json
            .agent/runs/${{ env.AGENT_RUN_ID }}/review.md
            .agent/runs/${{ env.AGENT_RUN_ID }}/review-raw.md

      - name: Require Human On Failure
        if: failure() && steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number('${{ steps.pr.outputs.number }}');
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: ['ai-review-needs-human'],
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `⚠️ The independent AI review could not be completed. Human review is required. See the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
            });
