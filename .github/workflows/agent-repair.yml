name: AI CI Repair

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ai-ci-repair-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.event == 'pull_request' ||
        github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Eligible Pull Request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const pr = pulls.find((candidate) =>
              candidate.head.sha === run.head_sha &&
              candidate.head.repo?.full_name === context.repo.repo &&
              candidate.head.ref.startsWith('codex/')
            );

            if (!pr) {
              core.info('No open same-repository pull request matches this run.');
              return;
            }

            const label = 'ai-ci-repair-attempted';
            if (pr.labels.some((item) => item.name === label)) {
              core.info(`Automatic repair was already attempted for PR #${pr.number}.`);
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: [label],
            });

            core.setOutput('number', String(pr.number));
            core.setOutput('branch', pr.head.ref);
            core.setOutput('sha', pr.head.sha);
            core.setOutput('title', pr.title);
            core.setOutput('body', pr.body || '');
            const enhancement = pr.title.match(
              /^enhance(?:ment)?\(([^)]+)\)\s*[:：]/i,
            );
            core.setOutput(
              'component',
              enhancement?.[1]?.trim() ||
                pr.title.replace(/^(?:feat|fix|enhance|refactor|chore|docs)(?:\([^)]*\))?\s*[:：]\s*/i, ''),
            );

      - name: Check Out Pull Request
        if: steps.pr.outputs.number != ''
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AI_PIPELINE_TOKEN || github.token }}
          persist-credentials: false
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0

      - name: Warn About Automation Token
        if: steps.pr.outputs.number != ''
        env:
          AI_PIPELINE_TOKEN: ${{ secrets.AI_PIPELINE_TOKEN }}
        run: |
          if [ -z "$AI_PIPELINE_TOKEN" ]; then
            echo "::warning::AI_PIPELINE_TOKEN is not configured. The repaired commit may not trigger a new CI workflow."
          fi

      - name: Prepare Repair Branch
        if: steps.pr.outputs.number != ''
        env:
          COMPONENT: ${{ steps.pr.outputs.component }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin main "${{ steps.pr.outputs.branch }}"
          git checkout -B "${{ steps.pr.outputs.branch }}" "${{ steps.pr.outputs.sha }}"
          git ls-tree -r --name-only origin/main -- .agent | rg -v '^\.agent/runs/' | while IFS= read -r file; do
            git restore --source=origin/main --worktree --staged -- "$file"
          done
          RUN_ID=$(git diff --name-only origin/main...HEAD -- .agent/runs | awk -F/ 'NF >= 3 { print $3 }' | head -n 1)
          if [ -z "$RUN_ID" ]; then
            echo "Unable to locate the Agent run directory for this pull request."
            exit 1
          fi
          printf 'AGENT_BRANCH=%s\n' "${{ steps.pr.outputs.branch }}" >> "$GITHUB_ENV"
          printf 'AGENT_RUN_ID=%s\n' "$RUN_ID" >> "$GITHUB_ENV"
          printf 'AGENT_COMPONENT=%s\n' "$COMPONENT" >> "$GITHUB_ENV"
          printf 'AGENT_TYPE=bugfix\n' >> "$GITHUB_ENV"
          printf 'AGENT_BASE_REF=origin/main\n' >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        if: steps.pr.outputs.number != ''

      - uses: actions/setup-node@v4
        if: steps.pr.outputs.number != ''
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        if: steps.pr.outputs.number != ''
        run: pnpm install --frozen-lockfile

      - name: Install Browser
        if: steps.pr.outputs.number != ''
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture Failed CI Logs
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run view "${{ github.event.workflow_run.id }}" --log-failed > "$RUNNER_TEMP/ci-failure.log"

      - name: Apply Deterministic Fixes
        if: steps.pr.outputs.number != ''
        run: |
          CI=true pnpm format
          CHANGED=$(git diff --name-only origin/main -- packages apps e2e | rg '\.(?:ts|tsx|js|jsx|mjs|cjs)$' || true)
          if [ -n "$CHANGED" ]; then
            printf '%s\n' "$CHANGED" | xargs -r pnpm exec oxlint --fix || true
          fi
          CI=true pnpm format

      - name: Verify Deterministic Fixes
        if: steps.pr.outputs.number != ''
        id: verify
        continue-on-error: true
        run: |
          set -o pipefail
          { CI=true pnpm check && CI=true pnpm test:e2e && CI=true pnpm build; } 2>&1 | tee "$RUNNER_TEMP/agent-ci-verification.log"

      - name: Run Agent Repair
        if: steps.pr.outputs.number != '' && steps.verify.outcome == 'failure'
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL: ${{ secrets.ARK_MODEL || 'ark-code-latest' }}
          AGENT_COMPONENT: ${{ steps.pr.outputs.component }}
          AGENT_RUN_ID: ${{ env.AGENT_RUN_ID }}
          AGENT_TYPE: bugfix
          AGENT_BASE_REF: origin/main
        run: AGENT_REPAIR_LOG="$RUNNER_TEMP/agent-ci-verification.log" node .agent/agent.mjs

      - name: Verify Agent Repair
        if: steps.pr.outputs.number != '' && steps.verify.outcome == 'failure'
        run: |
          CI=true pnpm format
          CHANGED=$(git diff --name-only origin/main -- packages apps e2e | rg '\.(?:ts|tsx|js|jsx|mjs|cjs)$' || true)
          if [ -n "$CHANGED" ]; then
            printf '%s\n' "$CHANGED" | xargs -r pnpm exec oxlint --fix || true
          fi
          CI=true pnpm format
          CI=true pnpm check
          CI=true pnpm test:e2e
          CI=true pnpm build

      - name: Commit Verified Repair
        if: success() && steps.pr.outputs.number != ''
        id: commit
        run: |
          echo "committed=false" >> "$GITHUB_OUTPUT"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No repository changes are required."
            exit 0
          fi
          git add -A
          git commit --no-verify -m "fix(ui): repair CI failures"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Run Independent Review Loop
        id: review
        if: steps.commit.outputs.committed == 'true'
        continue-on-error: true
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL: ${{ secrets.ARK_MODEL || 'ark-code-latest' }}
          ARK_VERIFIER_MODEL: ${{ secrets.ARK_VERIFIER_MODEL || secrets.ARK_MODEL || 'ark-code-latest' }}
          AGENT_MAX_REVISIONS: "2"
          AGENT_PR_TITLE: ${{ steps.pr.outputs.title }}
          AGENT_PR_BODY: ${{ steps.pr.outputs.body }}
        run: node .agent/review-loop.mjs

      - name: Select Review Outcome
        id: gate
        if: steps.commit.outputs.committed == 'true'
        env:
          REVIEW_ACTION: ${{ steps.review.outputs.action }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          if [ "$REVIEW_OUTCOME" = "success" ]; then
            echo "action=$REVIEW_ACTION" >> "$GITHUB_OUTPUT"
          else
            echo "action=needs-human" >> "$GITHUB_OUTPUT"
          fi

      - name: Push Reviewed Repair
        id: push
        if: >-
          steps.review.outcome == 'success' &&
          steps.gate.outputs.action == 'awaiting-human-review'
        env:
          PIPELINE_TOKEN: ${{ secrets.AI_PIPELINE_TOKEN || github.token }}
        run: |
          git push "https://x-access-token:${PIPELINE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${AGENT_BRANCH}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger CI When No Automation Token
        if: steps.push.outputs.pushed == 'true'
        env:
          AI_PIPELINE_TOKEN: ${{ secrets.AI_PIPELINE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$AI_PIPELINE_TOKEN" ]; then
            gh workflow run ci.yml --ref "$AGENT_BRANCH"
            echo "Dispatched CI because no automation token is configured."
          fi

      - name: Upload Repair Logs
        if: always() && steps.pr.outputs.number != ''
        uses: actions/upload-artifact@v4
        with:
          name: ai-ci-repair-${{ github.event.workflow_run.id }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/ci-failure.log
            ${{ runner.temp }}/agent-ci-verification.log
            .agent/runs/${{ env.AGENT_RUN_ID }}/review-verification-*.log
            .agent/runs/${{ env.AGENT_RUN_ID }}/review-finder-round-*.json
            .agent/runs/${{ env.AGENT_RUN_ID }}/review-round-*.json
            .agent/runs/${{ env.AGENT_RUN_ID }}/review.md
            .agent/runs/${{ env.AGENT_RUN_ID }}/review-repair.md
            .agent/runs/${{ env.AGENT_RUN_ID }}/review-loop-result.json
            .agent/runs/${{ env.AGENT_RUN_ID }}/review-raw.md
            .agent/runs/${{ env.AGENT_RUN_ID }}/repair-raw.md

      - name: Publish Repair Review
        if: steps.review.outcome == 'success' && steps.commit.outputs.committed == 'true'
        env:
          REVIEW_ACTION: ${{ steps.gate.outputs.action }}
          PUSHED: ${{ steps.push.outputs.pushed || 'false' }}
          PULL_NUMBER: ${{ steps.pr.outputs.number }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AI_PIPELINE_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const issue_number = Number(process.env.PULL_NUMBER);
            const action = process.env.REVIEW_ACTION;
            const pushed = process.env.PUSHED === 'true';
            const runId = process.env.AGENT_RUN_ID;
            const reviewFile = `.agent/runs/${runId}/review.md`;
            const loopResultFile = `.agent/runs/${runId}/review-loop-result.json`;
            const review = fs.existsSync(reviewFile)
              ? fs.readFileSync(reviewFile, 'utf8')
              : 'The independent review did not complete. Human review is required.';
            const loopResult = fs.existsSync(loopResultFile)
              ? JSON.parse(fs.readFileSync(loopResultFile, 'utf8'))
              : null;
            const marker = '<!-- ai-review:latest -->';
            const body = [
              marker,
              action === 'awaiting-human-review' && pushed
                ? '## ✅ CI repair reviewed and pushed'
                : '## ⚠️ CI repair needs human attention',
              '',
              ...(pushed
                ? ['A new CI run should follow this reviewed repair.']
                : ['The verified repair was not pushed because the review did not reach `awaiting-human-review`.']),
              '',
              ...(loopResult?.reason
                ? [`Review loop stopped because: ${loopResult.reason}`, '']
                : []),
              review,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const markerComments = comments
              .filter((comment) => comment.body?.includes(marker))
              .reverse();
            let updated = false;
            for (const comment of markerComments) {
              try {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                  body,
                });
                updated = true;
                break;
              } catch (error) {
                if (error.status !== 403 && error.status !== 404) throw error;
              }
            }
            if (!updated) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
            for (const name of ['ai-ready-for-human', 'ai-needs-human']) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: [
                action === 'awaiting-human-review' && pushed
                  ? 'ai-ready-for-human'
                  : 'ai-needs-human',
              ],
            });

      - name: Comment On Success
        if: success() && steps.push.outputs.pushed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.pr.outputs.number }}'),
              body: `🤖 Automatic CI repair passed checks and independent review, and was pushed to this pull request. A new CI run has been triggered.`,
            });

      - name: Comment On Failure
        if: failure() && steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.pr.outputs.number }}'),
              body: `❌ Automatic CI repair did not pass all checks. No unverified repair was pushed. See the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for logs. Remove the ai-ci-repair-attempted label to allow another attempt.`,
            });
