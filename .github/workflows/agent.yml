name: AI Component Agent

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  develop:
    if: github.event.label.name == 'ai-develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Parse Issue and Initialize Run
        id: init
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title;
            const body = context.payload.issue.body || '';

            // Strip conventional commit prefix (support both : and ：)
            let name = title.replace(/^(?:feat|fix|enhance|refactor|chore|docs)\s*[:：]\s*/i, '');

            // Strip common verbs (English and Chinese)
            name = name.replace(/^(?:add|improve|create|add new)\s+/i, '');
            name = name.replace(/^(?:添加|新增|创建|修复)\s*/g, '');
            name = name.replace(/^组件\s*/g, '');

            const component = name.trim();

            // Branch-safe slug: ASCII only, spaces to hyphens
            const slug = component
              .replace(/[^a-zA-Z0-9\s-]/g, '')
              .replace(/\s+/g, '-')
              .toLowerCase() || 'component';

            const isBug = title.toLowerCase().startsWith('fix');
            const type = isBug ? 'bugfix' : 'new-component';
            const runId = `${slug}-${new Date().toISOString().slice(0, 10)}`;

            core.exportVariable('AGENT_COMPONENT', component);
            core.exportVariable('AGENT_SLUG', slug);
            core.exportVariable('AGENT_TYPE', type);
            core.exportVariable('AGENT_RUN_ID', runId);
            core.exportVariable('AGENT_ISSUE_BODY', body);

            console.log(`Component: ${component}, Slug: ${slug}, Type: ${type}, RunId: ${runId}`);

      - name: Create Work Branch
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          BRANCH="codex/${AGENT_SLUG}"
          git checkout -b "$BRANCH"
          echo "AGENT_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Run AI Agent
        id: agent
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL: ${{ secrets.ARK_MODEL || 'ark-code-latest' }}
          AGENT_COMPONENT: ${{ env.AGENT_COMPONENT }}
          AGENT_TYPE: ${{ env.AGENT_TYPE }}
          AGENT_ISSUE_BODY: ${{ env.AGENT_ISSUE_BODY }}
        run: node .agent/agent.mjs

      - name: Verify and Repair
        id: verify
        continue-on-error: true
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL: ${{ secrets.ARK_MODEL || 'ark-code-latest' }}
        run: |
          set -o pipefail
          CI=true pnpm format
          CI=true pnpm lint:fix || true
          CI=true pnpm exec playwright install --with-deps chromium

          ATTEMPT=1
          MAX_ATTEMPTS=3
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            LOG=".agent/runs/$AGENT_RUN_ID/verification-$ATTEMPT.log"
            echo "--- Verification attempt $ATTEMPT/$MAX_ATTEMPTS ---"
            if { CI=true pnpm check && CI=true pnpm test:e2e; } 2>&1 | tee "$LOG"; then
              echo "VERIFICATION_ATTEMPTS=$ATTEMPT" >> "$GITHUB_ENV"
              exit 0
            fi

            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "Verification still fails after $MAX_ATTEMPTS attempts."
              exit 1
            fi

            AGENT_REPAIR_LOG="$LOG" node .agent/agent.mjs
            CI=true pnpm format
            CI=true pnpm lint:fix || true
            ATTEMPT=$((ATTEMPT + 1))
          done

      - name: Create Draft PR
        if: always() && steps.agent.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const verifyPassed = '${{ steps.verify.outcome }}' === 'success';

            execSync('git add -A', { cwd: process.cwd() });
            execSync(`git commit --no-verify -m "feat(ui): add ${process.env.AGENT_COMPONENT} component\n\n🤖 Developed by AI Agent. See .agent/runs/${process.env.AGENT_RUN_ID}/ for spec and evidence."`, { cwd: process.cwd() });
            execSync(`git push origin ${process.env.AGENT_BRANCH}`, { cwd: process.cwd() });

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `feat(ui): ${process.env.AGENT_COMPONENT}`,
              head: process.env.AGENT_BRANCH,
              base: 'main',
              draft: true,
              body: [
                `Closes #${context.payload.issue.number}`,
                '',
                '## Spec',
                'See `.agent/runs/' + process.env.AGENT_RUN_ID + '/spec.md`',
                '',
                '## Verification',
                verifyPassed ? '✅ All checks passed after ' + process.env.VERIFICATION_ATTEMPTS + ' attempt(s)' : '❌ Automatic verification and repair did not pass. See [workflow run](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ') for details.',
                '',
                '🤖 Developed by AI Agent under human-defined spec patterns.'
              ].join('\n')
            });

            console.log(`Draft PR created: ${pr.data.html_url}`);

      - name: Comment on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `❌ AI Agent could not complete this change automatically.\n\nCheck the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for the generation or verification failure.`
            });
