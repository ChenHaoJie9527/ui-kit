name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@chenhaojie9527"

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - name: Publish hooks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(node -p "require('./packages/hooks/package.json').name")
          VERSION=$(node -p "require('./packages/hooks/package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION 已存在，跳过"
          else
            pnpm --filter "$NAME" publish --no-git-checks
          fi

      - name: Publish components
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(node -p "require('./packages/ui/package.json').name")
          VERSION=$(node -p "require('./packages/ui/package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION 已存在，跳过"
          else
            pnpm --filter "$NAME" publish --no-git-checks
          fi
