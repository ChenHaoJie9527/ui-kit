name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # v6 的输入名是 run_install（默认 null，本来不自动安装）。
          # 显式关掉，避免将来升级到把默认值改成 true 的版本；安装一律走下面的显式步骤。
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm -r build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # v6 的输入名是 run_install（默认 null，本来不自动安装）。
          # 显式关掉，避免将来升级到把默认值改成 true 的版本；安装一律走下面的显式步骤。
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/report/
