<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ui-kit · React hooks 与组件库</title>
    <meta
      name="description"
      content="ui-kit：React hooks 内核与组件库，包含受控状态、防抖、虚拟滚动、Tabs、Dialog、Toast 等基础能力。"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#fbfbfd"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#080a0f"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // 在首帧前应用已保存的主题，避免暗色模式闪白。
      (function () {
        try {
          var raw = localStorage.getItem("ui-kit-docs-theme");
          var mode = raw ? JSON.parse(raw) : null;

          if (mode === "light" || mode === "dark") {
            document.documentElement.dataset.theme = mode;
            document.documentElement.style.colorScheme = mode;
          }
        } catch (error) {
          // localStorage 不可用时直接使用系统主题。
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
