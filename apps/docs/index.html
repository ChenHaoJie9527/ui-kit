<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ui-kit · React hooks 与组件库</title>
    <meta
      name="description"
      content="ui-kit：React hooks 内核与组件库，包含受控状态、防抖、虚拟滚动、Tabs、Dialog、Toast 等基础能力。"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#fbfbfd"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#080a0f"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      /*
       * 全局层顺序。必须出现在任何打包 CSS 之前 —— CSS 的层优先级由第一次
       * 声明决定，写在 HTML 里比依赖 JS 模块导入顺序更稳。
       *
       * utilities 必须高于 uk.components，否则 className 里的 Tailwind 类
       * 覆盖不了组件样式；base 必须低于 uk.components，否则 reset 会抹掉
       * 组件自带的边框与背景。
       *
       * properties 必须最先：Tailwind 会生成一个兜底层，里面给所有元素写
       * `--tw-translate-x: 0` 等默认值（用于不支持 @property 的浏览器，
       * 主要是 Safari）。若不在这里声明，它会按出现顺序落到最后、成为优先级
       * 最高的层，把 translate / rotate / shadow 等工具类全部覆盖掉。
       */
      @layer properties, theme, base, uk.tokens, uk.components, components,
        utilities;
    </style>
    <script>
      // 在首帧前应用已保存的主题，避免暗色模式闪白。
      (function () {
        try {
          var raw = localStorage.getItem("ui-kit-docs-theme");
          var mode = raw ? JSON.parse(raw) : null;

          if (mode === "light" || mode === "dark") {
            document.documentElement.dataset.theme = mode;
            document.documentElement.style.colorScheme = mode;
          }
        } catch (error) {
          // localStorage 不可用时直接使用系统主题。
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
